services:

  postgres:
    image: postgres:16
    container_name: pg_database
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: esig_db
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d
      - ./dumps:/dumps

  tomcat:
    image: tomcat:10.1-jdk17
    container_name: tomcat_app
    ports:
      - "8081:8080"
    volumes:
      - ./apps/tomcat:/usr/local/tomcat/webapps/ROOT

  wildfly:
    image: quay.io/wildfly/wildfly:latest
    container_name: wildfly_app
    ports:
      - "8080:8080"
      - "9990:9990"
    command: bash -c "cp /tmp/ROOT.war.dodeploy /opt/jboss/wildfly/standalone/deployments/ROOT.war.dodeploy && 
            /opt/jboss/wildfly/bin/standalone.sh -b 0.0.0.0 -bmanagement 0.0.0.0" 
    volumes:
      - ./apps/wildfly/ROOT.war:/opt/jboss/wildfly/standalone/deployments/ROOT.war
      - ./apps/ROOT.war.dodeploy:/tmp/ROOT.war.dodeploy
